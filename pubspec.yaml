name: telemetrix
description: TELEMETRIX — 차량 텔레메트리 상태·이상·주행 기록 모니터링 앱

publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 클라이언트 — interceptor로 JWT 자동 첨부
  dio: ^5.4.3

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # 차트 (속도/RPM/온도 실시간 그래프)
  fl_chart: ^0.67.0

  # JWT 토큰 안전 저장 (iOS Keychain / Android Keystore)
  flutter_secure_storage: ^9.2.2

  # 푸시 알림 — Firebase 프로젝트 설정 후 주석 해제
  # (android/google-services.json, ios/GoogleService-Info.plist 필요)
  # firebase_messaging: ^14.9.4
  # firebase_core: ^2.30.1

  # 시간 표시
  timeago: ^3.6.1

  # 본문과 숫자의 일관된 타이포그래피
  google_fonts: ^6.2.1
  flutter_markdown_plus: ^1.0.12
  stomp_dart_client: ^3.0.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    # Manrope 정적 5종(OFL — assets/google_fonts/Manrope-OFL.txt). google_fonts가 에셋에서 먼저 찾으므로
    # 앱이 런타임에 내려받지 않고, 테스트도 네트워크 없이 같은 파일을 쓴다.
    - assets/google_fonts/
  # 한글: 나눔고딕 Regular·Bold(OFL — assets/fonts/NanumGothic-OFL.txt, 출처 assets/fonts/SOURCE.md).
  # Manrope에 한글이 없어 기기마다 OS 글꼴로 떨어지던 것을 앱이 직접 싣는다(2026-09-16 결정, 약 4MB).
  # 파일명·내용을 바꾸지 않는다 — Reserved Font Name이 있다.
  fonts:
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700
